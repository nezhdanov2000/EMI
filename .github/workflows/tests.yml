name: tests

on:
  push:
  pull_request:

jobs:
  locked:
    name: pytest (Python ${{ matrix.python }}, locked deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - run: python experiments/datasets.py
      - run: python -m pytest -q -rs

  min-deps:
    name: pytest (Python 3.10, oldest supported numpy/pandas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install "numpy==1.23.5" "pandas==1.5.3" pytest
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest -q -rs

  reference-data:
    name: regression witnesses on UCI Adult
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - run: python experiments/build_adult.py
      # These two tests skip without data/adult_census.csv; here they must run.
      - name: Adult witnesses must run, not skip
        run: |
          set -o pipefail
          python -m pytest -rs -v tests/test_centers.py -k "armed_forces or real_centres" | tee pytest.log
          if grep -q SKIPPED pytest.log; then echo "::error::Adult regression tests were skipped"; exit 1; fi
