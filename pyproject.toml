[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vsf"
version = "2.3.0"
description = "Visual Sufficiency Framework (VSF): Coverage-Certified Independent Branch Discovery for Exploratory Data Analysis"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "VSF Core Team" }]
requires-python = ">=3.10"
# `>=3.10` (not the `>=3.8` the old setup.py claimed) is a hard runtime
# requirement, not a stylistic choice: `pmd.py` uses PEP 604 `X | None`
# union syntax in function signatures with no
# `from __future__ import annotations`, which raises `TypeError` at import
# time on Python 3.8/3.9 (annotations are evaluated eagerly there). Every
# other module either has no bare union syntax or guards it with that
# future import (verified by grep across vsf/*.py); a prior version of
# this comment named four modules -- graph_inference.py, graph_miner.py,
# mining.py, permutation.py -- that no longer exist in this codebase.
# Lower bounds are the oldest versions the test suite has been run against
# (Python 3.10, numpy 1.23.5, pandas 1.5.3 - the "min-deps" CI job); the
# previous ">=1.20 / >=1.3" was never tested, and numpy 1.20 has no wheels
# for Python 3.10. requirements-lock.txt pins the versions results are
# produced with.
dependencies = [
    "numpy>=1.23.5",
    "pandas>=1.5.3",
]
# scipy was listed in the old setup.py's install_requires but is never
# imported anywhere in vsf/ or server.py (verified by grep across the
# codebase) — dropped as a phantom dependency.
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
# Explicit, not `find_packages()`: this repository's root also contains
# `tests/`. It does not belong inside the installable `vsf` distribution; it is
# consumed directly from the repository checkout, not from site-packages.
# `vsf.templates` IS included: it holds the CSS/JS/HTML assets
# `vsf.dashboard.export_full_dashboard` reads via `importlib.resources` at
# call time, so it must ship with the installed package, not just live in
# the source checkout. `vsf.webapp` is the analogous asset package for
# `vsf.server.serve()` — the live interactive app's `index.html`/
# `static/css/*`/`static/js/*`, read the same way at request
# time by `vsf/server.py`'s request handler. Its `static/` subdirectory is
# not itself a Python package (no `__init__.py`, never imported); that's
# fine, `package-data` globs are resolved relative to the owning package's
# directory regardless of whether a subdirectory is itself a package.
packages = ["vsf", "vsf.templates", "vsf.webapp"]

[tool.setuptools.package-data]
# Non-.py files aren't included by default; without this, an installed
# (non-editable) `vsf` would import fine but `export_full_dashboard()`
# (for "vsf.templates") or `vsf.serve()` (for "vsf.webapp") would raise
# FileNotFoundError the first time it's called.
"vsf.templates" = ["*.css", "*.js", "*.html"]
"vsf.webapp" = ["*.html", "static/css/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running statistical calibration checks (deselect with -m 'not slow')",
]
